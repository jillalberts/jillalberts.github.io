<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Darakah Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* High-Quality Video Background */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.6); /* تحسين وضوح النصوص */
        }

        /* Overlay to enhance contrast */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -1;
        }

        /* Glassmorphism Container */
        .main-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 60px 40px;
            text-align: center;
            max-width: 450px;
            width: 85%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            animation: slideUp 1s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            font-size: 1.8rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        p {
            font-weight: 300;
            color: #f0f0f0;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        /* Professional Transparent Countdown */
        .timer-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 120px;
            height: 120px;
        }

        .timer-svg circle {
            fill: none;
            stroke-width: 5;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: rgba(255, 255, 255, 0.1);
        }

        .circle-progress {
            stroke: var(--primary);
            stroke-dasharray: 360;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 5px var(--primary));
        }

        .timer-val {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
        }

        /* Premium Button */
        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-action.active {
            background: white;
            color: #004e92;
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-action:hover {
            transform: scale(1.05);
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Nature/Water Video Background -->
    <video autoplay muted loop id="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-aerial-view-of-a-blue-ocean-water-4009-large.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>
    <div class="overlay"></div>

    <div class="main-card">
        <h1>Welcome Friend</h1>
        <p>Connecting to secure resources...</p>

        <div class="timer-wrap">
            <svg class="timer-svg">
                <circle class="circle-bg" cx="60" cy="60" r="57"></circle>
                <circle class="circle-progress" id="bar" cx="60" cy="60" r="57"></circle>
            </svg>
            <div class="timer-val" id="num">5</div>
        </div>

        <button class="btn-action" id="btn" onclick="go()">Access Now</button>
    </div>

    <script>
        let count = 5;
        const num = document.getElementById('num');
        const bar = document.getElementById('bar');
        const btn = document.getElementById('btn');
        const total = 360;

        const timer = setInterval(() => {
            count--;
            num.textContent = count;
            
            const offset = total - (count / 5) * total;
            bar.style.strokeDashoffset = offset;

            if (count <= 0) {
                clearInterval(timer);
                num.textContent = "0";
                btn.classList.add('active');
                setTimeout(go, 800);
            }
        }, 1000);

        function go() {
            window.location.replace("https://giorginausa.blogspot.com/2026/07/adsterra-adsterra.html?m=1");
        }
    </script>
</body>
</html>
