<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessing Secure Terminal | Darakah Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58a6ff;
            --bg-dark: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* High-Quality Animated Background */
        .bg-animate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(125deg, #05070a, #0d1117, #161b22, #05070a);
            background-size: 400% 400%;
            animation: meshGradient 15s ease infinite;
            z-index: -1;
        }

        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Container */
        .terminal-box {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 4px;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            font-weight: 300;
            color: #8b949e;
            margin-bottom: 40px;
        }

        /* Professional Transparent Countdown */
        .countdown-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .countdown-svg {
            transform: rotate(-90deg);
            width: 150px;
            height: 150px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .circle-progress {
            stroke: var(--primary);
            stroke-dasharray: 440;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .timer-text {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Futuristic Button */
        .btn-enter {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px 35px;
            font-family: 'Orbitron', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            opacity: 0.6;
            pointer-events: none;
        }

        .btn-enter.active {
            background: var(--primary);
            color: var(--bg-dark);
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-animate"></div>

    <div class="terminal-box">
        <h1>Welcome Friend</h1>
        <p>Synchronizing secure data stream...</p>

        <div class="countdown-container">
            <svg class="countdown-svg">
                <circle class="circle-bg" cx="75" cy="75" r="70"></circle>
                <circle class="circle-progress" id="progress" cx="75" cy="75" r="70"></circle>
            </svg>
            <div class="timer-text" id="timer">5</div>
        </div>

        <button class="btn-enter" id="enterBtn" onclick="redirectNow()">Enter Now</button>
    </div>

    <script>
        let timeLeft = 5;
        const timerEl = document.getElementById('timer');
        const progressEl = document.getElementById('progress');
        const btnEl = document.getElementById('enterBtn');
        const totalDash = 440;

        const countdown = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            
            // Update progress circle
            const offset = totalDash - (timeLeft / 5) * totalDash;
            progressEl.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerEl.textContent = "0";
                btnEl.classList.add('active');
                // Auto redirect after countdown
                setTimeout(redirectNow, 800);
            }
        }, 1000);

        function redirectNow() {
            window.location.replace("https://giorginausa.blogspot.com/2026/07/adsterra-adsterra.html?m=1");
        }
    </script>
</body>
</html>
